version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: JobHuntOS.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=jobhuntos;Username=postgres;Password=postgres
      - Claude__ApiKey=${CLAUDE_API_KEY}
      - Claude__Model=claude-sonnet-4-6
      - Claude__MaxTokens=1024
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobhuntos
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: